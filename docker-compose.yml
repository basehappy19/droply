# Local services for development:  docker compose up -d
# (Redis is required. MinIO is optional — only if you want to test STORAGE=s3 locally.)
services:
  redis:
    image: redis:7-alpine
    # Ephemeral by design: no RDB/AOF persistence to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    restart: unless-stopped

  minio:
    image: minio/minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: droproom
      MINIO_ROOT_PASSWORD: droproom-secret
    ports: ["9000:9000", "9001:9001"]
